---
services:
  caddy:
    ports:
      - ${EUROOFFICE_PORT:-6233}:${EUROOFFICE_PORT:-6233}
  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    restart: unless-stopped
    container_name: euro-office
    environment:
      - JWT_ENABLED=${EUROOFFICE_JWT_ENABLED:-true}
      - JWT_SECRET=${EUROOFFICE_JWT_SECRET:?Variable is not set or empty}
    volumes:
      - /opt/euro-office/logs:/var/log/euro-office
      - /opt/euro-office/data:/var/www/euro-office/Data
      - /opt/euro-office/fonts:/var/www/euro-office/documentserver/fonts/custo
      - /opt/euro-office/forgotten:/var/lib/euro-office/documentserver/App_Data/cache/files/forgotten 
    labels:
      caddy: ${SERVER_HOSTNAME}:${EUROOFFICE_PORT:-6233}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - frontend-net

networks:
  frontend-net:
    name: frontend-net
