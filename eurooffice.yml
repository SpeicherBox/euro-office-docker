---
services:
  caddy:
    ports:
      - ${EUROOFFICE_PORT:-6233}:${EUROOFFICE_PORT:-6233}
  eurooffice:
    image: ghcr.io/euro-office/documentserver:latest
    restart: unless-stopped
    container_name: euro-office
    environment:
      - JWT_ENABLED=${EUROOFFICE_JWT_ENABLED:-true}
      - JWT_SECRET=${EUROOFFICE_JWT_SECRET:?Variable is not set or empty}
    volumes:
      - logs:/var/log/euro-office
      - data:/var/lib/euro-office/documentserver
      - fonts:/var/www/euro-office/documentserver/fonts/custo
      - forgotten:/var/lib/euro-office/documentserver/App_Data/cache/files/forgotten
      - config:/etc/euro-office/documentserver
    labels:
      caddy: ${SERVER_HOSTNAME}:${EUROOFFICE_PORT:-6233}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - frontend-net

volumes:
  config:
  forgotten:
  fonts:
  data:
  logs:

networks:
  frontend-net:
    name: frontend-net
